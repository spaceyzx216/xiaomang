<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">小芒 AI · 内容生产工作台</title>
  <desc id="desc">从洞察到创作，再从复盘回到下一轮内容。React、Node.js、MongoDB 构建的团队工作台。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1280" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0A101B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1100 20) rotate(132) scale(530 410)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6B34C" stop-opacity=".16"/>
      <stop offset="1" stop-color="#F6B34C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="830" y1="115" x2="1140" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6B34C"/>
      <stop offset="1" stop-color="#75CABD"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#surface)"/>
  <rect width="1280" height="480" rx="24" fill="url(#glow)"/>
  <path d="M720 0H1256Q1280 0 1280 24V456Q1280 480 1256 480H720V0Z" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1279" height="479" rx="23.5" stroke="#FFFFFF" stroke-opacity=".09"/>
