    <text x="87" y="85" text-anchor="middle" fill="#111827" font-size="29" font-weight="700">芒</text>
    <text x="126" y="83" fill="#D7DDE6" font-size="19" font-weight="600" letter-spacing="3">XIAOMANG / AI WORKSPACE</text>
