      <rect x="181" y="376" width="130" height="33" rx="16.5" fill="none" stroke="#354050"/><text x="246" y="398">Node.js 22+</text>
      <rect x="323" y="376" width="116" height="33" rx="16.5" fill="none" stroke="#354050"/><text x="381" y="398">MongoDB</text>
      <rect x="451" y="376" width="99" height="33" rx="16.5" fill="none" stroke="#354050"/><text x="500.5" y="398">Docker</text>
