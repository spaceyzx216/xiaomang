    <circle cx="818" cy="129" r="6" stroke="#F6B34C" stroke-width="1.8"/><path d="M823 134L828 139" stroke="#F6B34C" stroke-width="1.8" stroke-linecap="round"/>
    <text x="855" y="126" fill="#8D99AA" font-size="13" letter-spacing="2">01 / INSIGHT</text>
    <text x="854" y="151" fill="#F3F5F8" font-size="22" font-weight="600">让创作有依据</text>
    <rect x="892" y="202" width="284" height="76" rx="16" fill="#1D2633" stroke="#3E4A5D"/>
