    <text x="66" y="262" fill="#E2E6ED" font-size="34" font-weight="500">把内容生产，连成闭环。</text>
    <text x="67" y="309" fill="#96A3B5" font-size="21">账号定位 · 内容创作 · 团队协作 · 数据复盘</text>
