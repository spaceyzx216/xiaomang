    <path d="M990 112C1160 112 1223 184 1196 273C1174 345 1080 380 980 368C869 355 798 299 812 215C820 166 866 132 920 120" stroke="url(#line)" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="5 7"/>
