# xiaomang production nginx example
# domain: work.yourdomain.com

server {
  listen 80;
  server_name work.yourdomain.com;

  # static frontend (vite build output)
  root /var/www/xiaomang/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # proxy to node service (server/index.js)
  location /tikhub-proxy/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE / stream support
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # backend health check passthrough
  location = /tikhub-proxy/health {
    proxy_pass http://127.0.0.1:8787/health;
  }
}
